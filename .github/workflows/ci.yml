name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both jobs only check out code and run tests: the token needs read access and nothing else.
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: crossborder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version # verify.sh reads the same file and fails on any other version
          install-only: true # verify.sh runs it, so lint has one invocation

      # The same gate script as `make verify`; it fails on any skipped test, so both services are required.
      - name: Verify gates
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/crossborder_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/15
          VERIFY_RACE: "1"
        run: ./scripts/verify.sh

  query-plans:
    # tests/performance: EXPLAIN (ANALYZE, BUFFERS) of every statement the worker, relay and API
    # send, on a dataset seeded at scale. Separate from the verify gate: plan shape needs scale.
    name: Query plans at scale
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: crossborder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Query plan suite
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/crossborder_test?sslmode=disable
        run: make perf
