version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_create_sources_and_products.up.sql"
      - "migrations/000002_create_outbox_events.up.sql"
      - "migrations/000003_create_ingestion_runs.up.sql"
      - "migrations/000004_create_raw_records.up.sql"
      - "migrations/000005_uq_ingestion_runs_active_source.up.sql"
      - "migrations/000006_schema_integrity_hardening.up.sql"
      - "migrations/000007_product_identity_versioning_changes.up.sql"
    queries: "internal/infrastructure/postgres/queries"
    gen:
      go:
        package: "generated"
        out: "internal/infrastructure/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
